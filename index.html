<!DOCTYPE html>
<html lang="en">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #eef0f5;
    --ink: #1b2233;
    --accent: #e5242f;
    --muted: #7a8196;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151f;
      --ink: #eceef6;
      --accent: #ff6b6b;
      --muted: #7b8299;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151f;
    --ink: #eceef6;
    --accent: #ff6b6b;
    --muted: #7b8299;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  section {
    min-height: 100svh;
    overflow-x: clip;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
  }
  .hero { align-content: center; justify-items: center; gap: 1.25rem; }
  .hero p {
    margin: 0;
    font-weight: 300;
    font-size: 1rem;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .hero .line {
    width: 1px;
    height: 4rem;
    background: linear-gradient(var(--muted), transparent);
  }
  .word {
    display: flex;
    font-weight: 600;
    font-size: clamp(2.6rem, 12vw, 10rem);
    line-height: 1;
    letter-spacing: 0.03em;
  }
  .word { --gap: 1.3em; --go: 0.95s; --hit: 1.21s; }
  .half { display: flex; }
  .pq { transform: translateX(calc(var(--gap) * -1)); }
  .bd { transform: translateX(var(--gap)); }
  .l {
    display: inline-block;
    opacity: 0;
    transform: scale(0) rotate(-24deg);
    transition:
      transform 0.7s cubic-bezier(0.34, 1.7, 0.5, 1),
      opacity 0.25s ease-out;
    transition-delay: calc(var(--i) * 60ms);
  }
  .bd .l { color: var(--accent); }
  .c { display: inline-block; }
  .word.pop .l { opacity: 1; transform: none; }

  .word.pop { animation: shake 0.3s linear var(--hit); }
  .word.pop .pq {
    animation:
      slamL 0.26s cubic-bezier(0.7, 0, 1, 0.6) var(--go) forwards,
      recoilL 0.6s cubic-bezier(0.2, 0.7, 0.3, 1) var(--hit) forwards;
  }
  .word.pop .bd { animation: slamR 0.26s cubic-bezier(0.7, 0, 1, 0.6) var(--go) forwards; }
  .word.pop .bd .c { animation: crash 1.1s linear calc(var(--hit) + var(--j) * 35ms) forwards; }

  @keyframes slamL { from { transform: translateX(calc(var(--gap) * -1)); } to { transform: translateX(0); } }
  @keyframes slamR { from { transform: translateX(var(--gap)); } to { transform: translateX(0); } }
  @keyframes recoilL {
    0% { transform: translateX(0); }
    22% { transform: translateX(-0.45em); }
    100% { transform: translateX(0); }
  }
  @keyframes shake {
    0%, 100% { transform: none; }
    15% { transform: translate(-0.04em, 0.02em); }
    35% { transform: translate(0.035em, -0.02em); }
    55% { transform: translate(-0.02em, 0.015em); }
    75% { transform: translate(0.012em, 0); }
  }
  @keyframes crash {
    0% { transform: none; animation-timing-function: ease-out; }
    30% { transform: translate(calc(var(--dx) * 0.4), -0.35em) rotate(calc(var(--r) * 0.4)); animation-timing-function: cubic-bezier(0.55, 0, 1, 0.7); }
    68% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); animation-timing-function: ease-out; }
    82% { transform: translate(calc(var(--dx) * 1.06), calc(var(--dy) - 0.14em)) rotate(calc(var(--r) * 1.04)); animation-timing-function: ease-in; }
    100% { transform: translate(calc(var(--dx) * 1.1), var(--dy)) rotate(calc(var(--r) * 1.06)); }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .l { opacity: 1; transform: none; transition: none; }
    .half, .word, .c { animation: none !important; transform: none !important; }
  }

  .game { align-content: center; justify-items: center; gap: 0.9rem; --board: min(88vw, 62svh, 520px); }
  .hud { display: flex; justify-content: space-between; width: var(--board); font-weight: 300; letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hud b { font-weight: 600; color: var(--ink); }
  #board { display: block; width: var(--board); height: var(--board); border: 3px solid var(--ink); background: var(--bg); touch-action: none; image-rendering: pixelated; outline: none; }
  .hint { margin: 0; min-height: 1.5em; font-weight: 300; letter-spacing: 0.04em; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <section class="hero">
    <p>scroll</p>
    <div class="line"></div>
  </section>

  <section>
    <h1 class="word" id="word" aria-label="pqpqbdbd">
      <span class="half pq"><span class="l" style="--i:0" aria-hidden="true"><span class="c">p</span></span><span class="l" style="--i:1" aria-hidden="true"><span class="c">q</span></span><span class="l" style="--i:2" aria-hidden="true"><span class="c">p</span></span><span class="l" style="--i:3" aria-hidden="true"><span class="c">q</span></span></span><span class="half bd"><span class="l" style="--i:4" aria-hidden="true"><span class="c" style="--j:0;--dx:.1em;--dy:.55em;--r:-70deg">b</span></span><span class="l" style="--i:5" aria-hidden="true"><span class="c" style="--j:1;--dx:.35em;--dy:.75em;--r:110deg">d</span></span><span class="l" style="--i:6" aria-hidden="true"><span class="c" style="--j:2;--dx:.55em;--dy:.45em;--r:-35deg">b</span></span><span class="l" style="--i:7" aria-hidden="true"><span class="c" style="--j:3;--dx:.85em;--dy:.7em;--r:160deg">d</span></span></span>
    </h1>
  </section>

  <section class="game" id="game">
    <div class="hud"><span>score <b id="score">0</b></span><span>best <b id="best">0</b></span></div>
    <canvas id="board" aria-label="Snake game"></canvas>
    <p class="hint" id="hint">arrow keys or swipe to start</p>
  </section>

<script>
  var word = document.getElementById('word');
  var target = word.parentElement;
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.intersectionRatio >= 0.6) word.classList.add('pop');
      else if (e.intersectionRatio < 0.05) word.classList.remove('pop');
    });
  }, { threshold: [0, 0.05, 0.6] });
  io.observe(target);
</script>

<script>
(function () {
  var N = 16;
  var cv = document.getElementById('board'), ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), hint = document.getElementById('hint');
  var snake, dir, queue, food, speed, score = 0, best = 0, state = 'idle', active = false;
  try { best = +localStorage.getItem('snake-best') || 0; } catch (e) {}
  bestEl.textContent = best;

  function placeFood() {
    var x, y, ok;
    do {
      x = Math.floor(Math.random() * N); y = Math.floor(Math.random() * N);
      ok = !snake.some(function (p) { return p.x === x && p.y === y; });
    } while (!ok);
    food = { x: x, y: y };
  }
  function reset() {
    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = { x: 1, y: 0 }; queue = []; score = 0; speed = 110;
    scoreEl.textContent = 0;
    placeFood();
  }
  function setState(st) {
    state = st;
    hint.textContent = st === 'idle' ? 'arrow keys or swipe to start'
      : st === 'play' ? 'eat the red block'
      : 'game over, press an arrow key or tap';
  }
  function turn(dx, dy) {
    if (state === 'over') { reset(); }
    if (state !== 'play') setState('play');
    var last = queue.length ? queue[queue.length - 1] : dir;
    if ((dx === last.x && dy === last.y) || (dx === -last.x && dy === -last.y)) return;
    if (queue.length < 2) queue.push({ x: dx, y: dy });
  }
  function die() {
    setState('over');
    if (score > best) {
      best = score; bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
  }
  function tick() {
    if (!active || state !== 'play') return;
    if (queue.length) dir = queue.shift();
    var h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    var eat = h.x === food.x && h.y === food.y;
    var body = eat ? snake : snake.slice(0, -1);
    if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some(function (p) { return p.x === h.x && p.y === h.y; })) {
      die(); draw(); return;
    }
    snake.unshift(h);
    if (eat) {
      score++; scoreEl.textContent = score;
      speed = Math.max(62, speed - 3);
      if (snake.length === N * N) { die(); draw(); return; }
      placeFood();
    } else snake.pop();
    draw();
  }
  function loop() { tick(); setTimeout(loop, speed); }

  function draw() {
    var cs = getComputedStyle(document.documentElement);
    var ink = cs.getPropertyValue('--ink').trim(), accent = '#e5242f';
    var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var root = document.documentElement.getAttribute('data-theme');
    if (root === 'dark' || (root !== 'light' && dark)) accent = '#ff6b6b';
    var c = cv.width / N, g = Math.max(1, Math.round(c * 0.07));
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = ink; ctx.globalAlpha = 0.05;
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++)
      if ((x + y) % 2) ctx.fillRect(x * c, y * c, c, c);
    ctx.globalAlpha = 1;
    ctx.fillStyle = accent;
    ctx.fillRect(food.x * c + g, food.y * c + g, c - 2 * g, c - 2 * g);
    ctx.fillStyle = state === 'over' ? accent : ink;
    snake.forEach(function (p, i) {
      var k = i === 0 ? 0 : g;
      ctx.fillRect(p.x * c + k, p.y * c + k, c - 2 * k, c - 2 * k);
    });
  }
  function resize() {
    var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    var px = Math.max(N, Math.floor(r.width * d / N) * N);
    cv.width = px; cv.height = px;
    draw();
  }

  var keys = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
               w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
  window.addEventListener('keydown', function (e) {
    var k = keys[e.key];
    if (!active || !k || e.metaKey || e.ctrlKey || e.altKey) return;
    e.preventDefault();
    turn(k[0], k[1]);
  });

  var sx, sy, moved = false;
  cv.addEventListener('pointerdown', function (e) { sx = e.clientX; sy = e.clientY; moved = false; });
  cv.addEventListener('pointermove', function (e) {
    if (sx == null) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    moved = true;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    sx = e.clientX; sy = e.clientY;
  });
  function endPtr() {
    if (sx != null && !moved && state !== 'play') turn(dir.x, dir.y);
    sx = null;
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', function () { sx = null; });

  new IntersectionObserver(function (es) {
    es.forEach(function (e) { active = e.intersectionRatio >= 0.6; });
  }, { threshold: [0, 0.6] }).observe(document.getElementById('game'));

  window.addEventListener('resize', resize);
  reset(); resize(); loop();
})();
</script>
</body>
</html>
